<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stand — WK 2026 Poule</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <span class="logo-icon">⚽</span>
      <h1>WK 2026 POULE<span>Familie Voorspellingen</span></h1>
    </div>
    <nav>
      <a href="/" class="nav-link">Voorspellingen</a>
      <a href="/standings.html" class="nav-link active">Stand</a>
      <a href="/leaderboard.html" class="nav-link">Klassement</a>
      <a href="/rules.html" class="nav-link">Regels</a>
      <a href="/admin.html" id="admin-nav-link" class="nav-link" style="display:none">Admin</a>
      <span id="user-chip" class="user-chip"></span>
      <button class="btn-logout" onclick="logout()">Uitloggen</button>
    </nav>
    <button class="hamburger-btn" onclick="toggleMobileNav()">&#9776;</button>
  </div>
  <div class="mobile-nav" id="mobile-nav">
    <a href="/" class="mobile-nav-link">Voorspellingen</a>
    <a href="/standings.html" class="mobile-nav-link active">Stand</a>
    <a href="/leaderboard.html" class="mobile-nav-link">Klassement</a>
    <a href="/rules.html" class="mobile-nav-link">Regels</a>
    <a href="/admin.html" id="mobile-admin-link" class="mobile-nav-link" style="display:none">Admin</a>
    <div class="mobile-nav-footer">
      <span id="mobile-user-chip" class="user-chip"></span>
      <button class="btn-logout" onclick="logout()">Uitloggen</button>
    </div>
  </div>
</header>

<div class="page">
  <div class="page-title">Stand & Schema</div>

  <div class="standings-tabs">
    <button class="standings-tab active" data-view="groups" onclick="switchView('groups')">Groepen</button>
    <button class="standings-tab" data-view="thirds" onclick="switchView('thirds')">Beste nr. 3</button>
    <button class="standings-tab" data-view="bracket" onclick="switchView('bracket')">Schema</button>
  </div>

  <div id="view-groups"></div>
  <div id="view-thirds" style="display:none"></div>
  <div id="view-bracket" style="display:none"></div>

  <div id="standings-loading" class="loading">Laden...</div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/flags.js"></script>
<script src="/js/standings.js"></script>
</body>
</html>
